name: Build and Release Air AE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish standalone Windows app
        run: dotnet publish AirAE/AirAE.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Air-AE-Windows-x64
          path: publish/AirAE.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1
          name: Air AE 2.1.1
          generate_release_notes: true
          make_latest: true
          files: publish/AirAE.exe
